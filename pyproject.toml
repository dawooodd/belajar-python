[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "belajar-python-lengkap"
version = "2026.10.1"
description = "Kurikulum Komprehensif Belajar Python: Dari Dasar, Lanjut, Concurrency, Django hingga Machine Learning & AI Modern."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Python Mastery Team", email = "developer@pythonmastery.local" }
]
dependencies = [
    "django>=5.0.0",
    "djangorestframework>=3.14.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
    "04_projek_framework_django/core_app/tests.py",
]
python_files = ["test_*.py", "*_test.py"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
